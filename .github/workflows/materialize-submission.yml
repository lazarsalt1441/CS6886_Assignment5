name: Replace the approved report once
on:
  push:
    branches: [main]
    paths: [".report_upload/manifest.json"]
permissions:
  contents: write
jobs:
  replace-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Publish only the exact uploaded PDF and remove transfer files
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, shutil
          from pathlib import Path
          folder = Path(".report_upload")
          data = b"".join((folder / ("part%04d.bin" % i)).read_bytes() for i in range(4))
          assert hashlib.sha256(data).hexdigest() == "4fd2c05e128d791801f235ea53c28f8639443e67fca4b627e56b2713e5e7fc3c"
          assert data.startswith(b"%PDF-")
          Path("report.pdf").write_bytes(data)
          shutil.rmtree(folder)
          Path(".github/workflows/materialize-submission.yml").unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace report.pdf with the updated uploaded report"
          git push origin HEAD:main
